<H2>Wang 600 Program Codes</H2>

This section describes all keys on the keyboard (that generate program codes), and what codes are generated.
Note, the "Function Pushbuttons" and "Function Keys" are used together to form a complete program
code. The pushbuttons are set to the desired code of the first number, and then one of the keys
00 through 15 is pressed to generate the full code.
