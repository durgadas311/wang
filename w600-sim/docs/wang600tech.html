<H2>Wang 600 Programming Techniques</H2>

In general, any key that can be used in Run mode may be entered into a program and
used to perform the same function there. Exceptions are the keys PRIME, SET P.C.,
VERIFY PROG, RECORD PROG, and STEP. These all directly affect the calculator
and cannot be used in a program.

<P>Unless otherwise directed by program codes, the execution of a program continues
through the steps in numerical order.

<H3>Example program: convert farenheit to celsius</H3>

Here is a simple program to convert degrees
farenheit to degrees celsius. The basic formula being used is:

<PRE>
C = (F - 32) * 5 / 9
</PRE>

<P>The program will assume that the user entered the degrees F before pressing GO.
The following program will perform the conversion:

<PRE>
STORE (left)
3
2
- (left)
5
&#215;= (left)
9
&divide;= (left)
END PROG
</PRE>

<P>Note, the above keys (except for END PROG) are the same ones that would be used
to perform the conversion manually, using the Wang 600 as a simple calculator.

<P>Place the calculator in Learn mode (or Learn and Print) and enter the above codes.
If you used Learn and Print, or List Program after entering it, you should have
the following listing on the printer:

<PRE>
 0000  06 15    ST15     
 0001  00 03     E3      
 0002  00 02     E2      
 0003  03 15     -15     
 0004  00 05     E5      
 0005  04 15     &#215;15     
 0006  00 09     E9      
 0007  05 15     &divide;15     
 0008  09 14     *    EP 
</PRE>

<P>Now go back to Run mode, enter a number of degrees farenheit, and press GO.
You should see in the display the number converted to degress celsius.

<P>This program is included with the distribution. You should be able to
load it using the tape drive. It is named "celsius.wng".

<H3>Changing Program execution Sequence</H3>

Branching (Goto) is accomplished with the SEARCH command.
SEARCH is followed by an arbitrary code that corresponds to
a previously MARK'ed step using the same code. For example,
SEARCH 00&nbsp;00 will cause the program to continue execution at
step(s0 after the MARK 00&nbsp;00 in the program.

<P>Subroutine calls are made by either the f(x) commands or through the
extended command 15&nbsp;07. f(x), and SHIFT f(x), cause a "call" to
the step MARK f(x). For example, 10&nbsp;00 will make a subroutine
call to MARK 10&nbsp;00. 15&nbsp;07 (CALL) is followed by any code,
and will make a subroutine call to MARK <I>code</I>.
A subroutine ends with a RETURN code, which causes the program
to resume at the step after the f(x) or CALL. Note, a complex
subroutine may have multiple exit points, each with its own RETURN.

<P>In addition, there are "Jump" codes that test some condition and
then skip the next two program steps if that condition is true.
Note, 2 programs steps is the number required for a SEARCH or CALL
command. If less than 2 steps are required,
the remaining may be filled with GO commands.
The basic jump commands test the display, or the Program Error
state.

<P><TABLE BORDER>
<TR><TD>J<SUP>IF</SUP>0</TD><TD>Skip the next 2 steps if the display equals 0</TD>
<TR><TD>J<SUP>IF</SUP>&#8800;0</TD><TD>Skip the next 2 steps if the display does not equal 0</TD>
<TR><TD>J<SUP>IF</SUP>+</TD><TD>Skip the next 2 steps if the display is positive (&gt;=0)</TD>
<TR><TD>J<SUP>IF</SUP>ERROR</TD><TD>Skip the next 2 steps if the Program Error condition is true. This also clears the error condition.</TD>
</TABLE>

<P>There are additional jump codes:

<P><TABLE BORDER>
<TR><TD>&#945; J<SUP>IF</SUP>0</TD><TD>Skip the next 2 steps if register 00 00 equals the display</TD>
<TR><TD>&#945; J<SUP>IF</SUP>+</TD><TD>Skip the next 2 steps if register 00 00 is &gt;= the display</TD>
<TR><TD>&#945; SIN</TD><TD>Skip the next 2 steps if register 00 00 is &lt; the display</TD>
</TABLE>

<P>There are also "literal compare" jump codes:

<P><TABLE BORDER>
<TR><TD>I/O f(x)</TD><TD>Skip the next 2 steps if register 00 00 is identical to the display ('x' is don't-care)</TD>
<TR><TD>I/O SHIFT f(x)</TD><TD>Skip the next 2 steps if register 00 00 is not identical to the display ('x' is don't-care)</TD>
</TABLE>
