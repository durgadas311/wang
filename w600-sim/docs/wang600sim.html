<H2>Wang 600 Simulator Differences</H2>

The simulator attempts to mimic operations of the original Wang 600
hardware as much as possible.  Some obvious differences are the
peripherals (tape, printers, etc.), since no physical devices exist.

<P>Because the simulator runs real microcode from an actual Wang 600,
it should behave identically to the original. However, some practicalities
as well as possible oversights in hardware simulation may result in
subtle differences. See the section on "Simulator Internals", below,
for more information.

<H3>Keyboard Operation</H3>

The virtual keyboard may be entirely operated by the mouse. For
convenience, some real keyboard shortcuts are allowed. The most useful
one is that the real keyboard "Shift" key transfers directly to the Wang
600 SHIFT key. Holding down the real keyboard Shift will illuminate the
Wang 600 keyboard SHIFT, as visual feedback.

<P>In addition, the number entry keys are activated by the real keyboard
digit keys, plus "e" or "E" map to SET EXP, "-" or "+" map to CHANGE SIGN,
and "." maps to the decimal point.

<H3>Tape Operation</H3>

The tape drive uses files on the local system. These files have raw
binary program codes only.  The files may have multiple program images,
each terminated by an END PROG code, but the preferred method of operation
is to put only one program image in a file.

<P>Program image files are normally stored in the user's home directory
in a folder named "Wang600Files".

<P>In order to LOAD PROG or RECORD PROG, the tape unit must be "Ready",
by depressing the "Tape Ready" button.  If these operations are attempted
when the Tape Ready button is not depressed, the display will blank.
Pressing PRIME will restore normal operations.

<P>The "Release" (tape eject) button will pop-up a file-selection dialog
to allow choosing a file to use as a tape image.

<P>The "Forward" and "Rewind" buttons will move the current location
inside a file to the next, or previous, program image. Since most files
will have only one program image, these are not normally used.

<H3>Printer Operation</H3>

Like the original hardware, the printer must be "On" in order to
print. In Run mode, attempts to print (or List Program, etc) will hang
with a blank display (just like the original hardware) until either the
printer is turned on or PRIME is pressed. Programs that
attempt to print will simply stop without printing anything.

<P>Since there is no physical printer, the printed output is put in a
window where it may be viewed.  In addition, this window allows Copy
operations (e.g. Cut-n-Paste) to extract the contents (or a portion of
it).  In addition, a menu option "Save" may be used to save the current
contents to a file.  A menu option "Tear Off" will clear the print window
and discard all current contents.  The window is only visible when the
printer is "On", and if the window is closed then the printer is turned
off. The contents of the window is not removed when the printer is off.

<P>The menu option "Print" will send the re-formatted output to the
default printer. The "paper strip" will be formatted on a landscape page
in four columns of 40 lines each, per page.

<H3>Expansion ROM</H3>

The expansion ROMs are handled as files, similar to the Tape unit.
Selecting the ROM item from the "Devices" menu will pop-up a file
selection dialog, the chosen file will be downloaded to the simulator
and placed in the ROM memory. Up to 2048 steps may be loaded.
The file is formatted like other program images, the first byte is
loaded into the highest address, the next is loaded into the next lower
address, etc.

<H3>601/602/611 OutputWriter</H3>

These peripherals were based on modified IBM Selectric typewriters.
Printing to this device causes the "output window" to become visible.
Selecting the device from the "Devices" menu also makes it visible.
Currently, the device is always considered "connected" and "on".
The output may be consumed in the same way as for the built-in printer
(Saved, Printed, or Tear Off).

<P>The Print option formats the output onto separate pages that are
156 characters wide and typically 58 lines long. Plotted data is
printed in the same scale. Note that long plots will be split
between several pages, as continuous-feed paper is not supported
on most printers currently in use.

<H3>630 Fixed/Removable Disk</H3>

This device is simulated by a single file that supports the entire
16M address range of the device protocol. So there is not a separate removable
disk, but simply a single image that may be read/written as a whole.
Selecting the "630 Disk" option from the "Devices" menu will pop-up
a file selection dialog from which a image may be selected to use as
the disk. The file will be expanded as needed by writes. The file may
also be "sparse", if writes are made beyond the current end of file.
Unwritten portions of the file will read back as zero.

<H3>Simulator Internals</H3>

The original Wang 600 microcode was constantly executing instructions
the entire time that the calculator was turned on. The simulator cannot
afford to consume 100% CPU on the host system. One major area of
consumption is the display refresh routines. To minimize system load,
the refresh routines are "short cut" and long periods of refresh
(stopped in Run mode, alpha-STOP when running a program, etc.) are
converted into sleeps (waiting for a keyboard event, or sleep for
a predetermined amount of time).

<P>On the original calculator, the display was only visible during
the time that the microcode was actually refreshing the display.
All other times the display was blank, simply because it was not being
refreshed. The simulator has a static display that does not go blank
when refreshing stops. In order to better simulate the original hardware,
specific places in the microcode have been identified and the display
is explicitly blanked at those times. In addition, whenever a keyboard
event takes place the display is blanked. It is possible, though, that
there are places that have not been identified yet that the display
would go blank on the original hardware but not in the simulator.

<P>The simulator is capable of operating must faster than the original
calculator. Because of this, there are subtle differences in the
behavior of the display while running a program (for example). Consider
a program that uses alpha-STOP to display intermediate results.
The calculations between two alpha-STOP's may take so little time
on the simulator that the interleaving blanked display is not
perceptible.

<P>Peripherals are handled by the microcode, and as such will behave
the same as the original calculator up to the point that the
microcode hands off control to the simulator.

<P>One example is the original tape drive, which simply recorded a stream
of 0's and 1's onto the tape. The simulator must interpret those 0's
and 1's and convert them back into 4-bit words of data.  The simulator
must also convert the 4-bits words back into signals that the microcode
expects to see when reading the tap.  Also, the original microcode used
1-second gaps on the tape to indicate the end/beginning of a program
(or registers) image. That is not practical when using files, so the
gaps are represented with a pair of END&nbsp;PROG codes and the simulator
must convert to/from the equivalent signals and timing for the microcode.

<P>Another example is the built-in drum printer. The simulator must
convert "drum position" and "column hammer" values into characters
that can be displayed (and printed) on modern computers. Also, the drum
printer had some highly-specialized glyphs (symbols) that can only be
approximated using modern, standard character-set, fonts.
