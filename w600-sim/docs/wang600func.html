<H2>Wang 600 Program Codes</H2>

<TABLE BORDER>
<TR><TH>Key Sequence</TH><TH>Code</TH><TH>Function</TH></TR>

<TR><TH COLSPAN=3>"Program Print" Codes</TH></TR>
<TR><TD>PRINT tf</TD><TD>08 02, tt ff</TD><TD>Print, formatted, using 'ff' decimal places<BR>and with letter tag 'tt'</TD></TR>

<TR><TH COLSPAN=3>"Alpha" Codes</TH></TR>
<TR><TD>&#945; STOP</TD><TD>09 02, 09 03</TD><TD>1 second pause</TD></TR>
<TR><TD>&#945; SEARCH</TD><TD>09 02, 08 00</TD><TD>&#960;</TD></TR>
<TR><TD>&#945; PRINT</TD><TD>09 02, 08 02</TD><TD>enable key trace</TD></TR>
<TR><TD>&#945; f(x)</TD><TD>09 02, 10 xx</TD><TD>display &#215;= 10<SUP>xx</SUP></TD></TR>
<TR><TD>&#945; F(x)</TD><TD>09 02, 11 xx</TD><TD>display &divide;= 10<SUP>xx</SUP></TD></TR>
<TR><TD>&#945; LOAD PROG</TD><TD>09 02, 08 14</TD><TD>execute directly from tape</TD></TR>
<TR><TD>&#945; 1/X</TD><TD>09 02, 08 15</TD><TD>read something from tape...</TD></TR>
<TR><TD>&#945; RECALL</TD><TD>09 02, 08 01</TD><TD>recall registers from tape,<BR>start with R(display), R(display - 1), ...</TD></TR>
<TR><TD>&#945; STORE</TD><TD>09 02, 09 01</TD><TD>store register(s) to tape,<BR>start with R(display), R(display - 1), ...</TD></TR>
<TR><TD>&#945; J<SUP>IF</SUP>0</TD><TD>09 02, 08 04</TD><TD>jump if R0 = display</TD></TR>
<TR><TD>&#945; J<SUP>IF</SUP>+</TD><TD>09 02, 08 05</TD><TD>jump if R0 &gt;= display</TD></TR>
<TR><TD>&#945; SIN</TD><TD>09 02, 08 06</TD><TD>jump if R0 &lt; display</TD></TR>

<TR><TH COLSPAN=3>Program Control</TH></TR>
<TR><TD>MARK mm</TD><TD>09 00, mm mm</TD><TD>Set Label mm mm</TD></TR>
<TR><TD>SEARCH mm</TD><TD>08 00, mm mm</TD><TD>Jump to (MARK, 10 xx)</TD></TR>
<TR><TD>f(x)</TD><TD>10 xx</TD><TD>Call function (MARK, 10 xx)</TD></TR>
<TR><TD>F(x)</TD><TD>11 xx</TD><TD>Call function (MARK, 11 xx)</TD></TR>
<TR><TD>D7* mm</TD><TD>15 07, mm mm</TD><TD>Call function (MARK, mm mm)</TD></TR>

<TR><TH COLSPAN=3>Program Control in ROM</TH></TR>
<TR><TD>Ax*</TD><TD>12 xx</TD><TD>Call ROM f(x) (MARK, 12 xx)</TD></TR>
<TR><TD>Bx*</TD><TD>13 xx</TD><TD>Call ROM F(x) (MARK, 13 xx)</TD></TR>
<TR><TD>D3* mm</TD><TD>15 03, mm mm</TD><TD>Jump to ROM (MARK, mm mm)</TD></TR>
<TR><TD>D4* mm</TD><TD>15 04, mm mm</TD><TD>jump to ROM (MARK, mm mm)</TD></TR>
<TR><TD>D5* mm</TD><TD>15 05, mm mm</TD><TD>jump to ROM (MARK, mm mm)</TD></TR>
<TR><TD>D6* mm</TD><TD>15 06, mm mm</TD><TD>jump to ROM (MARK, mm mm)</TD></TR>
<TR><TD>D12* mm</TD><TD>15 12, mm mm</TD><TD>Call ROM function (MARK, mm mm)</TD></TR>

<TR><TH COLSPAN=3>Misc Data</TH></TR>
<TR><TD>INDIR cr</TD><TD>15 11, cc rr</TD><TD>Perform register OP 'cc' indirectly on R(rr)</TD></TR>
<TR><TD>Cx*</TD><TD>14 xx</TD><TD>Exchange display and R(xx)</TD></TR>
<TR><TD>D1* tf</TD><TD>15 01, tt ff</TD><TD>Print formatted, same as program print<BR>but works from keyboard</TD></TR>
<TR><TD>D10* aa</TD><TD>15 10, aa aa</TD><TD>mimics alpha functions</TD></TR>

<TR><TH COLSPAN=3>I/O Codes</TH></TR>

<TR><TD>I/O xy*</TD><TD>15 02, xx yy<BR>xx: 00-09<BR>yy: 00-15</TD><TD>
					Print display to "Output Writer 6053"<BR>
					xx = integer places<BR>yy = decimal places</TD></TR>
<TR><TD>I/O f(x)</TD><TD>15 02, 10 xx</TD><TD>unknown</TD></TR>
<TR><TD>I/O F(x)</TD><TD>15 02, 11 xx</TD><TD>unknown</TD></TR>
<TR><TD>I/O Ay*</TD><TD>15 02, 12 yy</TD><TD>Print yy blanks to "Output Writer 6053"</TD></TR>
<TR><TD>I/O By*</TD><TD>15 02, 13 yy</TD><TD>Other I/O</TD></TR>
<TR><TD>I/O C0*</TD><TD>15 02, 14 00</TD><TD>jump if R0 = display</TD></TR>
<TR><TD>I/O D0*</TD><TD>15 02, 15 00</TD><TD>jump if R0 &#8800; display</TD></TR>

</TABLE>

<P>* Requires use of pushbuttons 1-7, and Sp/8, in combination with keys 00-15 to form code.
