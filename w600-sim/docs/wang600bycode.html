* Two-step command sequences, described below
<P>

<TABLE BORDER>
<TR><TH>Prefix</TH><TH>Notes on use and second step</TH></TR>

<TR><TD CLASS="tag">SEARCH, MARK, and Call</TD>
	<TD>The second step is a "label", used to implement goto and call.
	Any code may be used, however END PROG should be avoided.</TD></TR>
<TR><TD CLASS="tag">STORE and RECALL</TD>
	<TD>The second step is a register number, 00 00 through 15 15.
	Note, registers above 15 06 are system memory and should not be used.
	The register 09 14 is the END PROG command and will affect program listings
	and recording/loading from tape.</TD></TR>
<TR><TD CLASS="tag">INDIR</TD>
	<TD>The second step is a register command. The operation is performed
	on the register number that is stored in the register.
	If register 05 contains 123.00000000, then INDIR +05 will add
	the display to register 123 (which is also known as 07 11).
	</TD></TR>
<TR><TD CLASS="tag" ROWSPAN=13>&#945;</TD>
	<TD>00 00 through 03 15: Print character(s) to OutputWriter, prefixed with 02 08 (print mode). Output stops
	when 02 02 is seen (not printed).
	Codes 04 00 through 07 15 print 00 00 through 03 15 but prefixed
	with a 03 08 (plot mode).
	Resulting symbols are described in table below.
	NOTE: this is not a two-step command, but variable length. Code 02 02 terminates command.
	</TD></TR>
<TR>	<TD>SEARCH: Value of &#960;
	</TD></TR>
<TR>	<TD>PRINT: Turn on keyboard trace (Printer must be ON)
	</TD></TR>
<TR>	<TD>&#945;: Turn off keyboard trace
	</TD></TR>
<TR>	<TD>STOP: 1 second pause
	</TD></TR>
<TR>	<TD>10 xx: Multiply display by 10<SUP>xx</SUP>
	</TD></TR>
<TR>	<TD>11 xx: Multiply display by 10<SUP>-xx</SUP>
	</TD></TR>
<TR>	<TD>J<SUP>IF</SUP>0: Jump if 00 00 = display
	</TD></TR>
<TR>	<TD>J<SUP>IF</SUP>+: Jump if 00 00 >= display
	</TD></TR>
<TR>	<TD>SIN: Jump if 00 00 < display
	</TD></TR>
<TR>	<TD>LOAD PROG: Skip N records and load program from tape. N is integer portion of
	current display value.
<TR>	<TD>STORE: Record N registers to tape. Registers are recorded in reverse
	order, N-1 through 00 00.
<TR>	<TD>RECALL: Load N registers from tape. Registers are loaded in reverse
	order, N-1 through 00 00.
	</TD></TR>

<TR><TD CLASS="tag">Print, and PRINT inside a program</TD>
	<TD>First half, 00 through 15, selects letter "tag" to be printed along side.
	Second half, 00 through 14, select number format, or if 15 prints blank line
	(no letter tag).
	</TD></TR>

<TR><TD CLASS="tag" ROWSPAN=9>I/O</TD>
	<TD>00 00 through 09 15: Print display, formatted, to OutputWriter (device 1). First number is
	number of (blank-filled) integer places, second is number of decimal places.
	00 xx is for scientific notation, also xx 11 through xx 15.
	</TD></TR>
<TR>	<TD>10 xx: Jump if R0 = display (string compare, not numeric)
	</TD></TR>
<TR>	<TD>11 xx: Jump if R0 &#8800; display (string compare, not numeric)
	</TD></TR>
<TR>	<TD>12 xx: Print field of xx blanks to OutputWriter.
	</TD></TR>
<TR>	<TD>13 xx: page-in/out blocks of program steps to/from "device 2", as follows.
	"disk" address is R(00) (integer portion, 0 - 16M). R(01) is the starting program step number
	(integer portion, 0000 - 1847). Length determined by low three bits of suffix:
	0 = 1 step, 1 = 8 steps, 2 = 16 steps, 3 = 24 steps, 4 = 32 steps, 5 = 48 steps, 6 = 56 steps, 7 = 64 steps.
	</TD></TR>
<TR>	<TD>13 00 - 13 07: input program steps.
	</TD></TR>
<TR>	<TD>13 08 - 13 15: output program steps.
	</TD></TR>
<TR>	<TD>14 xx: same as 10 xx.
	</TD></TR>
<TR>	<TD>15 xx: same as 11 xx.
	</TD></TR>
	</TD></TR>

<TR><TD CLASS="tag">GROUP 1</TD>
	<TD>Send next code to "device 4". In program, issues XS=0, then XS=4 with data, then program stops (press GO to continue).
	(does device generate GO?)
	</TD></TR>

<TR><TD CLASS="tag">GROUP 2</TD>
	<TD>Send next code to "device 5". In program, issues XS=0, then XS=5 with data, then program stops (press GO to continue).
	(does device generate GO?)
	</TD></TR>

</TABLE>
