* Two-step command sequences, described below

<P><TABLE BORDER>
<TR><TH>SEARCH, MARK, and Call prefixes</TH></TR>
<TR><TD>The second step is a "label", used to implement goto and call.
	Any code may be used, however END&nbsp;PROG should be avoided.</TD></TR>
</TABLE>

<P><TABLE BORDER>
<TR><TH>STORE and RECALL prefixes</TH></TR>
<TR><TD>The second step is a register number, 00&nbsp;00 through 15&nbsp;15.
	Note, registers above 15&nbsp;06 are system memory and should not be used.
	The register 09&nbsp;14 is the code for the END&nbsp;PROG command,
	and using it as a direct-target register in a program will affect
	program listings, recording/loading from tape, and inserting/deleting
	program steps.</TD></TR>
</TABLE>

<P><TABLE BORDER>
<TR><TH>INDIR prefix</TH></TR>
<TR><TD>The second step is a register command. The operation is performed
	on the register number that is stored in that register.
	If register 05 contains 158.00000000, then INDIR&nbsp;+05 will add
	the display to register 158 (which is also known as 09&nbsp;14).
	Note, this method of accessing register 09&nbsp;14 (END&nbsp;PROG) will not
	interfere with program control functions.
	</TD></TR>
</TABLE>

<P><TABLE BORDER>
<TR><TH COLSPAN=2>&#945; prefix</TH></TR>
<TR><TD>00&nbsp;00 through 03&nbsp;15</TD>
	<TD>Print character(s) to OutputWriter.
	Output stops when 02&nbsp;02 is seen (not printed).
	Each character is prefixed by the "print mode" control character 02&nbsp;08.
	Resulting symbols are described in table below.
	<BR>NOTE: this is not a two-step command, but variable length.
	Code 02&nbsp;02 terminates command.
	</TD></TR>
<TR><TD>04&nbsp;00 through 07&nbsp;15</TD>
	<TD>Plot 00 00 through 03&nbsp;15 on OutputWriter.
	The character is prefixed by the "plotting mode" control character 03&nbsp;08
	and the "step control characters" needed to move the carriage
	based on registers 00&nbsp;00 and 00&nbsp;01.
	The integer portion of 00&nbsp;00 controls movement in the Y direction,
	the integer portion of 00&nbsp;01 controls movement in the X direction.
	<BR>NOTE: this is not a two-step command, but variable length.
	Code 02&nbsp;02 terminates command.
	</TD></TR>

<TR>	<TD>SEARCH</TD><TD> Value of &#960; to display
	</TD></TR>
<TR>	<TD>PRINT</TD><TD> Turn on keyboard trace (Printer must be ON)
	</TD></TR>
<TR>	<TD>&#945;</TD><TD> Turn off keyboard trace
	</TD></TR>
<TR>	<TD>STOP</TD><TD> 1 second pause
	</TD></TR>
<TR>	<TD>10 xx</TD><TD> Multiply display by 10<SUP>xx</SUP>
	</TD></TR>
<TR>	<TD>11 xx</TD><TD> Multiply display by 10<SUP>-xx</SUP>
	</TD></TR>
<TR>	<TD>J<SUP>IF</SUP>0</TD><TD> Jump if 00&nbsp;00 = display
	</TD></TR>
<TR>	<TD>J<SUP>IF</SUP>+</TD><TD> Jump if 00&nbsp;00 >= display
	</TD></TR>
<TR>	<TD>SIN</TD><TD> Jump if 00&nbsp;00 < display
	</TD></TR>
<TR>	<TD>LOAD PROG</TD><TD> Skip N records and load program from tape.
	N is integer portion of current display value.
<TR>	<TD>STORE</TD><TD> Record N+1 registers to tape.
	N is integer portion of current display value.
	Registers are recorded in reverse order, N through 00&nbsp;00.
<TR>	<TD>RECALL</TD><TD> Load N+1 registers from tape.
	N is integer portion of current display value.
	Registers are loaded in reverse order, N through 00&nbsp;00.
	</TD></TR>

</TABLE>

<P><TABLE BORDER>
<TR><TH COLSPAN=2>I/O prefix</TH></TR>
<TR><TD>00&nbsp;00 through 09&nbsp;15</TD>
	<TD>Print display, formatted, to OutputWriter (device 1). First number is
	number of (blank-filled) integer places, second is number of decimal places.
	00&nbsp;xx is for scientific notation, also xx&nbsp;11 through xx&nbsp;15.
	</TD></TR>
<TR>	<TD>10 xx</TD>
	<TD>Jump if 00&nbsp;00 = display (string compare, not numeric)
	</TD></TR>
<TR>	<TD>11 xx</TD>
	<TD>Jump if 00&nbsp;00 &#8800; display (string compare, not numeric)
	</TD></TR>
<TR>	<TD>12 xx</TD>
	<TD>Print field of xx blanks to OutputWriter.
	</TD></TR>
<TR>	<TD>13&nbsp;00 through 13&nbsp;07</TD>
	<TD>page-in blocks of program steps from "device 2".
	"Source" address is in 00&nbsp;00 (integer portion, 0 - 16M).
	In 00&nbsp;01 is the starting program step number
	(integer portion, 0000 - 1847).
	Length determined by 'xx':
	<TABLE BORDER>
	<TR><TH>00</TH><TD>1 step</TD></TR>
	<TR><TH>01</TH><TD>8 steps</TD></TR>
	<TR><TH>02</TH><TD>16 steps</TD></TR>
	<TR><TH>03</TH><TD>32 steps</TD></TR>
	<TR><TH>04</TH><TD>64 steps</TD></TR>
	<TR><TH>05</TH><TD>128 steps</TD></TR>
	<TR><TH>06</TH><TD>256 steps</TD></TR>
	<TR><TH>07</TH><TD>64 steps</TD></TR>
	</TABLE>
	</TD></TR>
<TR>	<TD>13&nbsp;08 through 13&nbsp;15</TD>
	<TD>page-out blocks of program steps to "device 2".
	"Destination" address is in 00&nbsp;00 (integer portion, 0 - 16M).
	In 00&nbsp;01 is the starting program step number
	(integer portion, 0000 - 1847).
	Length determined 'xx':
	<TABLE BORDER>
	<TR><TH>08</TH><TD>1 step</TD></TR>
	<TR><TH>09</TH><TD>8 steps</TD></TR>
	<TR><TH>10</TH><TD>16 steps</TD></TR>
	<TR><TH>11</TH><TD>32 steps</TD></TR>
	<TR><TH>12</TH><TD>64 steps</TD></TR>
	<TR><TH>13</TH><TD>128 steps</TD></TR>
	<TR><TH>14</TH><TD>256 steps</TD></TR>
	<TR><TH>15</TH><TD>64 steps</TD></TR>
	</TABLE>
	</TD></TR>
<TR>	<TD>14 xx</TD>
	<TD>same as 10&nbsp;xx.
	</TD></TR>
<TR>	<TD>15 xx</TD>
	<TD>same as 11&nbsp;xx.
	</TD></TR>
	</TD></TR>
</TABLE>
